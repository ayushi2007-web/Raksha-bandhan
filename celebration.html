<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Raksha Bandhan ❤️</title>

<link rel="stylesheet" href="style.css">

<style>
body{
margin:0;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:linear-gradient(135deg,#fff7d6,#ffe9b0,#fffdf5);
overflow:hidden;
font-family:Poppins,sans-serif;
}

.box{
text-align:center;
padding:20px;
animation:fade 2s;
}

.box img{
width:260px;
animation:float 3s infinite ease-in-out;
}

h1{
color:#8B0000;
font-size:50px;
margin-top:20px;
}

p{
font-size:22px;
color:#555;
line-height:1.8;
max-width:700px;
margin:auto;
}

h2{
margin-top:25px;
color:#b8860b;
}

@keyframes float{
0%{transform:translateY(0);}
50%{transform:translateY(-15px);}
100%{transform:translateY(0);}
}

@keyframes fade{
from{
opacity:0;
transform:scale(.8);
}
to{
opacity:1;
transform:scale(1);
}
}

/* Floating Hearts */

.heart{
position:absolute;
font-size:25px;
animation:up 8s linear infinite;
opacity:.7;
}

@keyframes up{
0%{
transform:translateY(100vh);
opacity:0;
}
100%{
transform:translateY(-120px);
opacity:1;
}
}
</style>

</head>

<body>

<div class="heart" style="left:10%;">❤️</div>
<div class="heart" style="left:25%;animation-delay:2s;">🌸</div>
<div class="heart" style="left:45%;animation-delay:4s;">💖</div>
<div class="heart" style="left:65%;animation-delay:1s;">🌺</div>
<div class="heart" style="left:85%;animation-delay:3s;">✨</div>

<div class="box">

<img src="rakhi2.webp" alt="Rakhi">

<h1>Happy Raksha Bandhan ❤️</h1>

<p>
No matter where life takes us,<br><br>

The bond of love, care and togetherness
will always remain strong.

May God bless all my brothers
with happiness, success,
good health and endless smiles.

</p>

<h2>With Lots of Love ❤️<br>— Ayushi 🌸</h2>

</div>

</body>
</html>
